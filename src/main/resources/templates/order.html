<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单 - 秒杀系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; }
        .container { max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .nav { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; gap: 10px; }
        .nav a { text-decoration: none; color: #667eea; padding: 8px 16px; border-radius: 4px; transition: background 0.3s; }
        .nav a:hover { background: #f0f0f0; }
        .order-list { display: flex; flex-direction: column; gap: 15px; }
        .order-card { background: white; border-radius: 8px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        .order-header { display: flex; justify-content: space-between; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .order-no { color: #666; font-size: 14px; }
        .order-status { padding: 4px 12px; border-radius: 4px; font-size: 12px; }
        .status-0 { background: #fff3cd; color: #856404; }
        .status-1 { background: #d4edda; color: #155724; }
        .status-2 { background: #f8d7da; color: #721c24; }
        .order-info { display: flex; gap: 20px; }
        .order-info img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; background: #f0f0f0; }
        .order-detail { flex: 1; }
        .order-detail h3 { margin-bottom: 8px; }
        .order-price { color: #e74c3c; font-size: 20px; font-weight: bold; }
        .empty { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>我的订单</h1>
    </div>
    <div class="container">
        <div class="nav">
            <a href="/">首页</a>
            <a href="/order">我的订单</a>
        </div>
        <div id="orderList" class="order-list"></div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        async function loadOrders() {
            const res = await fetch('/api/order/list', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await res.json();
            if (data.code === 200) {
                renderOrders(data.data);
            } else if (data.code === 401) {
                window.location.href = '/login';
            }
        }

        function renderOrders(orders) {
            const container = document.getElementById('orderList');
            if (orders.length === 0) {
                container.innerHTML = '<div class="empty">暂无订单</div>';
                return;
            }
            container.innerHTML = orders.map(order => `
                <div class="order-card">
                    <div class="order-header">
                        <span class="order-no">订单号: ${order.orderNo}</span>
                        <span class="order-status status-${order.status}">${getStatusText(order.status)}</span>
                    </div>
                    <div class="order-info">
                        <div class="order-detail">
                            <h3>秒杀商品</h3>
                            <p class="order-price">¥${order.price}</p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getStatusText(status) {
            const map = { 0: '待支付', 1: '已支付', 2: '已取消' };
            return map[status] || '未知';
        }

        loadOrders();
    </script>
</body>
</html>
