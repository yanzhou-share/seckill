<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理后台 - 秒杀系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; min-height: 100vh; }
        .header { background: linear-gradient(135deg, #2c3e50 0%, #3498db 100%); color: white; padding: 20px; text-align: center; }
        .header h1 { font-size: 24px; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .nav { background: white; border-radius: 8px; padding: 15px; margin-bottom: 20px; display: flex; gap: 10px; }
        .nav a { text-decoration: none; color: #3498db; padding: 8px 16px; border-radius: 4px; transition: background 0.3s; }
        .nav a:hover { background: #f0f0f0; }
        .nav a.active { background: #3498db; color: white; }
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { padding: 12px 24px; background: white; border-radius: 8px; cursor: pointer; transition: all 0.3s; }
        .tab.active { background: #3498db; color: white; }
        .panel { display: none; background: white; border-radius: 8px; padding: 20px; }
        .panel.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f8f9fa; font-weight: 600; }
        tr:hover { background: #f8f9fa; }
        .btn { padding: 8px 16px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; margin-right: 5px; }
        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #27ae60; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn:hover { opacity: 0.9; }
        .form-inline { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .form-inline input, .form-inline select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 4px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; }
        .modal.show { display: flex; align-items: center; justify-content: center; }
        .modal-content { background: white; border-radius: 8px; padding: 30px; width: 400px; max-width: 90%; }
        .modal-content h3 { margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: #555; }
        .form-group input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 20px; }
        .status-0 { color: #f39c12; }
        .status-1 { color: #27ae60; }
        .status-2 { color: #e74c3c; }
        .empty { text-align: center; padding: 40px; color: #999; }
    </style>
</head>
<body>
    <div class="header">
        <h1>秒杀系统管理后台</h1>
    </div>
    <div class="container">
        <div class="nav">
            <a href="/">前台</a>
            <a href="/admin" class="active">管理后台</a>
            <a href="/order">订单管理</a>
        </div>
        <div class="tabs">
            <div class="tab active" onclick="switchTab('product')">商品管理</div>
            <div class="tab" onclick="switchTab('activity')">秒杀活动</div>
        </div>

        <div id="productPanel" class="panel active">
            <div class="form-inline">
                <button class="btn btn-primary" onclick="showProductModal()">添加商品</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>名称</th>
                        <th>价格</th>
                        <th>库存</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="productList"></tbody>
            </table>
        </div>

        <div id="activityPanel" class="panel">
            <div class="form-inline">
                <button class="btn btn-primary" onclick="showActivityModal()">添加活动</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>商品ID</th>
                        <th>秒杀价</th>
                        <th>库存</th>
                        <th>开始时间</th>
                        <th>结束时间</th>
                        <th>状态</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="activityList"></tbody>
            </table>
        </div>
    </div>

    <div id="productModal" class="modal">
        <div class="modal-content">
            <h3 id="productModalTitle">添加商品</h3>
            <input type="hidden" id="productEditId">
            <div class="form-group">
                <label>商品名称</label>
                <input type="text" id="productName" placeholder="请输入商品名称">
            </div>
            <div class="form-group">
                <label>价格</label>
                <input type="number" id="productPrice" step="0.01" placeholder="请输入价格">
            </div>
            <div class="form-group">
                <label>库存</label>
                <input type="number" id="productStock" placeholder="请输入库存">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeProductModal()">取消</button>
                <button class="btn btn-primary" onclick="saveProduct()">保存</button>
            </div>
        </div>
    </div>

    <div id="activityModal" class="modal">
        <div class="modal-content">
            <h3>添加秒杀活动</h3>
            <div class="form-group">
                <label>商品ID</label>
                <input type="number" id="activityProductId" placeholder="请输入商品ID">
            </div>
            <div class="form-group">
                <label>秒杀价格</label>
                <input type="number" id="activityPrice" step="0.01" placeholder="请输入秒杀价格">
            </div>
            <div class="form-group">
                <label>秒杀库存</label>
                <input type="number" id="activityStock" placeholder="请输入库存">
            </div>
            <div class="form-group">
                <label>开始时间</label>
                <input type="datetime-local" id="activityStart">
            </div>
            <div class="form-group">
                <label>结束时间</label>
                <input type="datetime-local" id="activityEnd">
            </div>
            <div class="modal-actions">
                <button class="btn" onclick="closeActivityModal()">取消</button>
                <button class="btn btn-primary" onclick="saveActivity()">保存</button>
            </div>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/login';

        const headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token };

        function switchTab(type) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            if (type === 'product') {
                document.querySelectorAll('.tab')[0].classList.add('active');
                document.getElementById('productPanel').classList.add('active');
                loadProducts();
            } else {
                document.querySelectorAll('.tab')[1].classList.add('active');
                document.getElementById('activityPanel').classList.add('active');
                loadActivities();
            }
        }

        // Product CRUD
        async function loadProducts() {
            const res = await fetch('/api/product/list', { headers });
            const data = await res.json();
            if (data.code === 200) renderProducts(data.data);
        }

        function renderProducts(list) {
            const tbody = document.getElementById('productList');
            if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="5" class="empty">暂无商品</td></tr>'; return; }
            tbody.innerHTML = list.map(p => `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>¥${p.price}</td>
                    <td>${p.stock}</td>
                    <td>
                        <button class="btn btn-warning" onclick="editProduct(${p.id},'${p.name}',${p.price},${p.stock})">编辑</button>
                        <button class="btn btn-danger" onclick="deleteProduct(${p.id})">删除</button>
                    </td>
                </tr>
            `).join('');
        }

        function showProductModal(id, name, price, stock) {
            document.getElementById('productModal').classList.add('show');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.remove('show');
            document.getElementById('productEditId').value = '';
            document.getElementById('productName').value = '';
            document.getElementById('productPrice').value = '';
            document.getElementById('productStock').value = '';
            document.getElementById('productModalTitle').textContent = '添加商品';
        }

        function editProduct(id, name, price, stock) {
            document.getElementById('productEditId').value = id;
            document.getElementById('productName').value = name;
            document.getElementById('productPrice').value = price;
            document.getElementById('productStock').value = stock;
            document.getElementById('productModalTitle').textContent = '编辑商品';
            document.getElementById('productModal').classList.add('show');
        }

        async function saveProduct() {
            const id = document.getElementById('productEditId').value;
            const product = {
                name: document.getElementById('productName').value,
                price: parseFloat(document.getElementById('productPrice').value),
                stock: parseInt(document.getElementById('productStock').value)
            };
            if (id) product.id = parseInt(id);

            const url = id ? '/api/product' : '/api/product';
            const method = id ? 'PUT' : 'POST';
            await fetch(url, { method, headers, body: JSON.stringify(product) });
            closeProductModal();
            loadProducts();
        }

        async function deleteProduct(id) {
            if (!confirm('确认删除？')) return;
            await fetch('/api/product/' + id, { method: 'DELETE', headers });
            loadProducts();
        }

        // Activity CRUD
        async function loadActivities() {
            const res = await fetch('/api/seckill/listAll', { headers });
            if (res.status === 404) {
                document.getElementById('activityList').innerHTML = '<tr><td colspan="8" class="empty">暂无活动</td></tr>';
                return;
            }
            const data = await res.json();
            if (data.code === 200) renderActivities(data.data);
        }

        function renderActivities(list) {
            const tbody = document.getElementById('activityList');
            if (list.length === 0) { tbody.innerHTML = '<tr><td colspan="8" class="empty">暂无活动</td></tr>'; return; }
            const statusMap = { 0: '未开始', 1: '进行中', 2: '已结束' };
            tbody.innerHTML = list.map(a => `
                <tr>
                    <td>${a.id}</td>
                    <td>${a.productId}</td>
                    <td>¥${a.seckillPrice}</td>
                    <td>${a.stock}</td>
                    <td>${a.startTime}</td>
                    <td>${a.endTime}</td>
                    <td class="status-${a.status}">${statusMap[a.status]}</td>
                    <td>
                        ${a.status === 0 ? `<button class="btn btn-success" onclick="updateStatus(${a.id},1)">开启</button>` : ''}
                        ${a.status === 1 ? `<button class="btn btn-warning" onclick="updateStatus(${a.id},2)">关闭</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function showActivityModal() {
            document.getElementById('activityModal').classList.add('show');
        }

        function closeActivityModal() {
            document.getElementById('activityModal').classList.remove('show');
        }

        async function saveActivity() {
            const activity = {
                productId: parseInt(document.getElementById('activityProductId').value),
                seckillPrice: parseFloat(document.getElementById('activityPrice').value),
                stock: parseInt(document.getElementById('activityStock').value),
                startTime: document.getElementById('activityStart').value,
                endTime: document.getElementById('activityEnd').value
            };
            await fetch('/api/seckill', { method: 'POST', headers, body: JSON.stringify(activity) });
            closeActivityModal();
            loadActivities();
        }

        async function updateStatus(id, status) {
            await fetch(`/api/seckill/${id}/status?status=${status}`, { method: 'PUT', headers });
            loadActivities();
        }

        loadProducts();
    </script>
</body>
</html>
