version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: seckill-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: seckill
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7
    container_name: seckill-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data

  app:
    build: .
    container_name: seckill-app
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/seckill?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-root}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your-production-secret-change-this}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-10}
      RATE_LIMIT_MAX_COUNT: ${RATE_LIMIT_MAX_COUNT:-5}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      - mysql
      - redis

volumes:
  mysql-data:
  redis-data:
